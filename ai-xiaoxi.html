<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "SimHei", sans-serif;
    background: #E9F4FD;
    display: flex;
    justify-content: center;
    align-items: stretch;
  }
  .app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #FFFFFF;
  }
  /* 顶栏：与PPT标题栏同款深蓝 */
  header {
    background: #1F5C99;
    color: #FFFFFF;
    padding: 14px 22px 12px;
    flex: 0 0 auto;
  }
  header .course { font-size: 15px; opacity: .85; letter-spacing: 1px; }
  header h1 { font-size: 24px; font-weight: 600; margin-top: 3px; }
  /* 探究进度条 */
  .progress {
    display: flex;
    gap: 8px;
    padding: 10px 22px;
    background: #D9EAF9;
    flex: 0 0 auto;
    font-size: 13.5px;
    color: #33475B;
    align-items: center;
  }
  .progress .label { font-weight: 600; margin-right: 4px; }
  .chip {
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid #5CA9E9;
    background: #FFFFFF;
    color: #1F5C99;
    transition: all .2s;
  }
  .chip.done { background: #1F5C99; color: #FFFFFF; }
  /* 对话区 */
  .chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: #FFFFFF;
  }
  .msg { display: flex; gap: 12px; max-width: 72%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    flex: 0 0 44px;
    width: 44px; height: 44px;
    border-radius: 50%;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: #FFFFFF;
    background: #1F5C99;
    box-shadow: none;
  }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .msg.user .avatar { background: #5CA9E9; }
  .bubble {
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 16.5px;
    line-height: 1.75;
    color: #33475B;
    background: #E9F4FD;
    border: 1px solid #D9EAF9;
    white-space: pre-wrap;
  }
  .msg.user .bubble {
    background: #1F5C99;
    color: #FFFFFF;
    border-color: #1F5C99;
  }
  .bubble b { color: #1F5C99; }
  .msg.user .bubble b { color: #FFC000; }
  .bubble .warn { color: #A10B09; font-weight: 600; }
  /* 结论卡 */
  .card {
    align-self: center;
    max-width: 80%;
    border: 2px solid #1F5C99;
    border-radius: 12px;
    padding: 16px 22px;
    background: #E9F4FD;
    font-size: 16.5px;
    line-height: 1.8;
    color: #33475B;
  }
  .card h3 { color: #1F5C99; font-size: 17px; margin-bottom: 6px; }
  .card .eng { color: #A10B09; font-weight: 600; }
  /* 快捷提问 */
  .quick {
    flex: 0 0 auto;
    padding: 10px 22px 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    border-top: 1px solid #D9EAF9;
    background: #FFFFFF;
  }
  .quick button {
    font-family: inherit;
    font-size: 14.5px;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid #5CA9E9;
    background: #FFFFFF;
    color: #1F5C99;
    cursor: pointer;
    transition: background .15s;
  }
  .quick button:hover { background: #D9EAF9; }
  /* 输入区 */
  .inputbar {
    flex: 0 0 auto;
    display: flex;
    gap: 12px;
    padding: 14px 32px 18px;
    background: #FFFFFF;
  }
  .inputbar input {
    flex: 1;
    font-family: inherit;
    font-size: 16.5px;
    padding: 11px 16px;
    border: 1px solid #5CA9E9;
    border-radius: 10px;
    outline: none;
    color: #33475B;
    background: #FFFFFF;
  }
  .inputbar input:focus { border-color: #1F5C99; }
  .inputbar button {
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 600;
    padding: 11px 32px;
    border: none;
    border-radius: 10px;
    background: #1F5C99;
    color: #FFFFFF;
    cursor: pointer;
  }
  .inputbar button:hover { background: #33475B; }
</style>

function addMsg(text, who) {
  var div = document.createElement('div');
  div.className = 'msg ' + who;
  var av = document.createElement('div');
  av.className = 'avatar';
  if (who === 'bot') {
    av.innerHTML = '<img src="' + AVATAR_GIF + '" alt="小息">';
  } else {
    av.textContent = '我';
  }
  var bub = document.createElement('div');
  bub.className = 'bubble';
  bub.innerHTML = text;
  div.appendChild(av);
  div.appendChild(bub);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function botSay(text, delay) {
  setTimeout(function () { addMsg(text, 'bot'); }, delay || 500);
}

function markChip(id) {
  var el = document.getElementById(id);
  if (el) el.classList.add('done');
}

function refreshQuick() {
  var btn = document.getElementById('btnCard');
  btn.style.display = (state.fast && state.slow) ? 'inline-block' : 'none';
}

function askQuick(q) { inp.value = q; send(); }

function send() {
  var q = inp.value.trim();
  if (!q) return;
  addMsg(q, 'user');
  inp.value = '';
  setTimeout(function () { respond(q); }, 350);
}

function respond(q) {
  var s = q;

  // ===== 开放性延伸问题（放在通用规则之前，保证针对性回答） =====

  if (/发烫|发热|变烫|烫|温度升高|芯片温度/.test(s)) {
    botSay('<b>好问题！这里藏着一个常见的因果错觉，我们先理清关系。</b>\n\n'
      + '芯片温度升高，主要和"<b>采样太快</b>"有关，而不是太慢：\n'
      + '① 采样越密，主控板和传感器就越<b>没有时间休息</b>，持续工作→功耗增大→温度上升，长期还会加速元件老化；\n'
      + '② 而<b>单次</b>读取传感器本身耗电非常微小，采样太慢绝不会让芯片发烫，只会让数据滞后、监测失职。\n\n'
      + '再追问你一句：ESP32 上真正的"发热大户"其实是持续工作的 WiFi 模块。那么上传数据的频率和采样频率，需要一样密吗？');
    return;
  }

  if (/耗电|功耗|电池|续航|省电|能源|电量的变化/.test(s)) {
    botSay('<b>你摸到了"功耗设计"这个工程关键词。</b>\n\n'
      + '结论先行：<b>采样太快</b>明显费电——主控板、传感器无法进入休眠，整机的能耗随频率近似线性上升；<b>采样太慢</b>并不费电，但系统会"失职"。\n\n'
      + '更聪明的做法叫<b>自适应采样</b>：浓度快速变化时（如下课后人一多）加密采样，平稳时（如深夜无人）稀疏采样。这样既保实时又省电——你能想到教室里什么时候该"密"、什么时候该"疏"吗？');
    return;
  }

  if (/存储|内存|数据量|占用|冗余|堆积|太多数据|数据太多/.test(s)) {
    botSay('<b>从"数据量"角度切入，很专业！</b>\n\n'
      + '采样太快会产生大量<b>几乎相同的重复读数</b>：教室 CO₂ 一分钟才变化一点点，每 0.1 秒存一次，绝大部分数据不带来新信息，白白占用存储和内存，还会拖慢后续处理。\n'
      + '但反过来，数据太少（太慢）又会漏掉关键变化。\n\n'
      + '所以真实系统常配合"数据清洗"：只保存有变化的记录。想想看，怎样判断"这次读数和上次比值不值得存"？');
    return;
  }

  if (/wifi|WiFi|WIFI|网络|上传|云端|云平台|物联网|远程|手机查看/.test(s)) {
    botSay('<b>问到项目后期的关键设计了！</b>\n\n'
      + '项目 03（软件开发）就要做数据上传。注意区分两件事：<b>采样频率</b>决定"看多勤"，<b>上传频率</b>决定"传多勤"，两者可以不一样。\n\n'
      + '省流量的常见策略：主控板本地先判断，只有读数<b>明显变化或超标</b>时才上传，平时只低频率同步。\n'
      + '那么追问：如果每次采样都立刻上传，太快或太慢分别会带来什么问题？');
    return;
  }

  if (/精度|准确|准确度|误差|读数准|不准/.test(s)) {
    botSay('<b>这个问题问得非常内行——答案可能出乎你意料。</b>\n\n'
      + '<b>采样频率并不影响单次读数的准确度</b>：读数准不准，由传感器本身的硬件质量和校准决定。\n'
      + '采样频率影响的是数据的"<b>新鲜度</b>"——你多快能知道最新情况。\n\n'
      + '类比体温计：体温计准不准是体温计的事，多久量一次是你的事。两者别混淆哦。\n\n'
      + '那如果读数"偶尔跳变"（忽高忽低），除了采样频率，还可以用什么办法让结果更可信？提示：连续多次读数取平均。');
    return;
  }

  if (/其他传感器|别的传感器|更多传感器|加传感器|温湿度|湿度|PM2\.5|PM25|pm2\.5|烟雾|酒精|甲醛/.test(s)) {
    botSay('<b>扩展思维不错！这套系统完全搭得起来。</b>\n\n'
      + '两个冷知识：① MQ-135 其实不只对 CO₂ 敏感，对烟雾、酒精等挥发性气体也有反应（所以别对着它喷酒精测试）；② 常见的扩展还有 DHT11 温湿度传感器。\n\n'
      + '但注意工程代价：每多一个传感器，就多一路采样策略要设计、多一份功耗、多一组数据要处理。\n\n'
      + '如果让你给教室再配一个传感器，你会选什么、采样周期定多长？说说理由。');
    return;
  }

  if (/采样定理|奈奎斯特|Nyquist|nyquist/.test(s)) {
    botSay('<b>你已经摸到大学《通信原理》的门口了！</b>\n\n'
      + '通俗版采样定理：信号变化得越快，采样就必须越快，否则会"失真"——就像拍旋转的车轮，帧率不够时车轮看起来在倒转。\n\n'
      + '对照本课：教室 CO₂ 变化非常缓慢，秒级采样就足够"跟得上"；但如果监测的是快速变化的量（比如声波，每秒振动几百次），采样频率就得提到几万次每秒。\n\n'
      + '所以结论：采样周期不是拍脑袋定的，是由<b>被测量的变化速度</b>决定的。');
    return;
  }

  if (/怎么实现|如何实现|代码怎么写|程序怎么写|定时|循环|while|sleep|延时/.test(s)) {
    botSay('<b>想在代码层面落地，方向对了！</b>\n\n'
      + '最简单的写法：让主控板进入一个循环——<b>读取 → 处理 → time.sleep(采样周期) → 再读取</b>，周而复始。改 sleep 的参数就是改采样周期。\n'
      + '更精确的做法是用"定时器中断"：到点自动执行读取，不受其他代码拖累。\n\n'
      + '完整代码属于下节课"软件开发"的内容，今天你只需要想清楚：<b>周期应该设多长、为什么</b>。');
    return;
  }

  if (/自动|自主排风|阈值|判断逻辑|什么时候开|何时开|下节课/.test(s)) {
    botSay('<b>这正是下节课的核心任务，先给你留个悬念。</b>\n\n'
      + '自主排风的基本思路：设定一个 CO₂ 浓度<b>阈值</b>，读数超标就向继电器发高电平开风扇，恢复后关闭。\n\n'
      + '但留个思考题：如果只看<b>单次</b>读数就开关风扇，会不会误判？比如有同学刚对着传感器哈了一口气。你觉得可以怎么避免？\n\n'
      + '把这个想法带到下节课，我们一起验证。');
    return;
  }

  if (/太快|0\.1|频繁|密集/.test(s)) {
    state.fast = true; markChip('chip-fast'); refreshQuick();
    botSay('<b>探究方向一：采样太快的问题</b>\n\n'
      + '你提到了一个关键场景：如果主控板每 <b>0.1 秒</b>读一次传感器，会发生什么？\n\n'
      + '想一想这几条线索：\n'
      + '① 教室里的 CO₂ 浓度会在一瞬间剧变吗？——<b>不会</b>，它变化很缓慢；\n'
      + '② 那短时间内采到的一堆几乎相同的数据，是不是大部分都<b>用不上</b>？\n'
      + '③ 传感器的敏感元件每工作一次都有损耗，日夜不停地高速采样，硬件会怎样？\n'
      + '④ 主控板和电源也要一直满负荷运转，电从哪儿来？\n\n'
      + '请用自己的话概括：采样太快会带来哪些浪费和危害？');
    return;
  }

  if (/太慢|10\s*分|10min|很久|不常|稀疏/.test(s)) {
    state.slow = true; markChip('chip-slow'); refreshQuick();
    botSay('<b>探究方向二：采样太慢的问题</b>\n\n'
      + '再换个极端：如果每 <b>10 分钟</b>才读一次，又会怎样？\n\n'
      + '想象一下真实课堂：下课后教室没人，CO₂ 缓缓升高；上课后 40 个同学挤进来，浓度快速飙升——\n'
      + '① 如果第 9 分 59 秒才采一次样，这中间发生的超标，系统<b>知道吗</b>？\n'
      + '② 等系统"反应过来"要开风扇时，同学们是不是已经昏昏欲睡了？\n'
      + '③ 我们做这个系统的<b>初衷</b>是什么？这样的监测还有意义吗？\n\n'
      + '请概括：采样太慢会让系统失去什么？');
    return;
  }

  if (/结论|讨论完|总结卡|生成卡/.test(s)) {
    if (!(state.fast && state.slow)) {
      botSay('先别急～我们还没有把两个方向都探究完：\n\n① 还没聊过"<b>太快</b>"的问题；\n② 还没聊过"<b>太慢</b>"的问题。\n\n把两边都想清楚，结论才立得住。可以先点下面的快捷问题哦。');
      return;
    }
    state.bal = true; markChip('chip-bal');
    botSay('好！结合你们小组刚才的分析，这是我们的共同结论——', 400);
    setTimeout(function () {
      var card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<h3>探究结论卡 · 采样周期的工程权衡</h3>'
        + '采样<b>太慢</b> → 数据严重滞后，CO₂ 超标无法及时发现，监测失去意义；\n'
        + '采样<b>太快</b> → 持续损耗硬件寿命、浪费电能和数据冗余。\n\n'
        + '所以要在<b>监测实时性</b>和<b>硬件寿命</b>之间折中取舍，寻找平衡点。\n'
        + '（教室场景通常取<b>秒级~分钟级</b>，如 5~30 秒一次，具体取决于场景变化速度。）\n\n'
        + '在信息系统工程中，这种"两个目标互相制约、需要折中"的思想，'
        + '就是<span class="eng">工程思维</span>。';
      chat.appendChild(card);
      chat.scrollTop = chat.scrollHeight;
      botSay('把这张结论卡发到学习平台，然后准备汇报你们小组的理由吧！', 800);
    }, 1200);
    return;
  }

  if (/多久|多长|多少秒|合适|平衡|折中|多久一次|周期.*定|怎么.*定|如何.*定/.test(s)) {
    state.bal = true; markChip('chip-bal');
    botSay('<b>探究方向三：寻找平衡点</b>\n\n'
      + '这个问题问得好——但老师反问你：这个平衡点是一个固定答案吗？\n\n'
      + '提示你两条思考路径：\n'
      + '① CO₂ 浓度的<b>变化速度</b>决定下限：变化缓慢，就不必采得太密；\n'
      + '② <b>实时性要求</b>决定上限：希望多快发现超标？\n'
      + '猜一猜：对一间教室来说，秒级（如 5 秒）、十秒级（如 30 秒）还是分钟级（如 5 分钟）更合理？说说你的理由。\n\n'
      + '关键不在数字本身，而在于你能说出"<b>为什么</b>"——这正是工程折中。');
    return;
  }

  if (/什么是|定义|概念|采样周期/.test(s)) {
    botSay('<b>概念小卡片</b>\n\n'
      + '<b>采样周期</b>：主控板每隔多长时间读取一次传感器数据，这个时间间隔就叫采样周期。\n\n'
      + '类比一下：就像你每隔一段时间看一次体温计——\n'
      + '看得<b>太勤</b>，眼睛累、体温计也"累"（太快）；\n'
      + '看得<b>太疏</b>，发烧了都不知道（太慢）。\n\n'
      + '接下来可以分别探究"太快"和"太慢"各有什么问题，点下面的快捷按钮开始吧。');
    return;
  }

  if (/提示|没思路|不知道|Help|help|怎么办/.test(s)) {
    botSay('没关系，分两步想：\n\n'
      + '<b>第一步</b>，抓住两个极端关键词：太快（比如 0.1 秒一次）、太慢（比如 10 分钟一次）；\n'
      + '<b>第二步</b>，对每个极端问三个"会怎样"：\n'
      + '· 对<b>硬件</b>会怎样？（损耗、能耗）\n'
      + '· 对<b>数据</b>会怎样？（冗余 or 滞后）\n'
      + '· 对<b>我们的目标</b>（及时发现 CO₂ 超标）会怎样？\n\n'
      + '点"太快会怎样"和"太慢会怎样"两个按钮，我们逐个击破。');
    return;
  }

  if (/损耗|寿命|浪费|耗电|能耗|资源/.test(s)) {
    state.fast = true; markChip('chip-fast'); refreshQuick();
    botSay('对！你抓住了<b>太快</b>这一侧的核心：\n\n'
      + '传感器敏感元件每采样一次都有物理损耗，频率越高寿命越短；\n'
      + '同时主控板、无线模块持续运转，<b>电能</b>白白消耗；\n'
      + '还会产生大量重复数据，占用存储和计算资源。\n\n'
      + '继续追问自己：这些浪费换来了什么好处吗？如果没有，那"快"还有必要吗？');
    return;
  }

  if (/滞后|延迟|反应慢|发现|超标|及时|意义|失效/.test(s)) {
    state.slow = true; markChip('chip-slow'); refreshQuick();
    botSay('没错！你点中了<b>太慢</b>这一侧的要害：\n\n'
      + '数据严重<b>滞后</b>，CO₂ 已经超标很久系统才发现，\n'
      + '风扇该开的时候没开，同学们照样犯困——\n'
      + '监测就<b>失去了意义</b>，整个系统的目标落空。\n\n'
      + '现在两个极端都有了，试着把它们合起来：我们要在什么和什么之间找平衡？');
    return;
  }

  if (/实时性|硬件寿命|之间|兼顾|两个/.test(s)) {
    state.bal = true; markChip('chip-bal'); refreshQuick();
    botSay('非常接近答案了！\n\n'
      + '要兼顾的正是：<b>监测实时性</b>（太慢不行）和<b>硬件寿命 / 资源消耗</b>（太快不行）。\n'
      + '两者互相制约，只能<b>折中取舍</b>——这就是结论卡的核心。\n\n'
      + '准备好了就点"生成结论卡"，把小组的讨论成果固化下来吧。');
    return;
  }

  if (/你好|您好|hi|hello|你是谁|名字/.test(s)) {
    botSay('你好！我是"小息"——《让教室学会呼吸》的 AI 探究助手。\n\n'
      + '今天的任务：帮你们小组搞清楚一个工程问题——<b>主控板的采样周期为什么不能太快、也不能太慢？</b>\n\n'
      + '点下面的快捷按钮，或者直接把想法打出来，我们开始探究！');
    return;
  }

  if (/谢谢|感谢|懂了|明白|理解/.test(s)) {
    botSay('能自己想明白，才是真的明白！\n\n'
      + '别忘了把结论发到学习平台。如果汇报时被别的小组追问，欢迎随时回来问我。');
    return;
  }

  botSay('这是个好想法！不过为了聚焦今天的探究问题，建议围绕这三个方向展开：\n\n'
    + '① 采样<b>太快</b>会怎样？\n② 采样<b>太慢</b>会怎样？\n③ 平衡点<b>怎么定</b>？\n\n'
    + '你可以直接说想法，比如"太快是不是浪费电？"，我会陪你一步步推理；需要启发就点"给我一点提示"。');
}

addMsg('同学们好，我是 AI 探究助手"<b>小息</b>"。\n\n'
  + '刚才的系统只读取了一次数据、风扇只测试了 2 秒。如果要让系统进入真实的环境监测状态，就得回答一个问题：\n\n'
  + '<b>主控板读一次传感器，为什么不能太快（如 0.1s 一次），也不能太慢（如 10min 一次）？</b>\n\n'
  + '请按课程小组讨论，把想法告诉我，我会陪你一起推理。点下面的快捷问题开始吧！', 'bot');

inp.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') send();
});
inp.focus();
</script>
